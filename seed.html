<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Database - Ujian Online</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .seed-box { background: rgba(30,41,59,0.8); border: 1px solid rgba(148,163,184,0.1); border-radius: 16px; padding: 30px; max-width: 600px; margin: 40px auto; }
        .seed-box h2 { color: #f1f5f9; margin-bottom: 12px; }
        .seed-box p { color: #94a3b8; margin-bottom: 20px; }
        .log { background: rgba(15,23,42,0.7); border-radius: 10px; padding: 16px; font-family: monospace; font-size: 0.85em; max-height: 400px; overflow-y: auto; color: #6ee7b7; white-space: pre-wrap; line-height: 1.6; }
        .log .error { color: #fca5a5; }
        .log .info { color: #94a3b8; }
        .btn-seed { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 14px 28px; border: none; border-radius: 12px; font-size: 1em; font-weight: 700; cursor: pointer; font-family: inherit; margin-bottom: 16px; }
        .btn-seed:hover { box-shadow: 0 4px 20px rgba(99,102,241,0.35); }
        .btn-seed:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Seed Database</h1>
            <p class="subtitle">Upload semua soal ke Firebase Firestore</p>
        </header>
        <div class="seed-box">
            <h2>Upload 600 Soal ke Firestore</h2>
            <p>Klik tombol di bawah untuk mengupload semua bank soal (6 mapel x 100 soal) ke Firebase Firestore. Proses ini hanya perlu dilakukan <strong>1 kali saja</strong>.</p>
            <button class="btn-seed" id="btn-seed" onclick="runSeed()">Upload Soal ke Firebase</button>
            <div class="log" id="log"><span class="info">Siap untuk seed. Klik tombol di atas untuk mulai...</span></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <!-- Load semua soal -->
    <script src="js/soal-pai.js"></script>
    <script src="js/soal-ppkn.js"></script>
    <script src="js/soal-matematika.js"></script>
    <script src="js/soal-bahasa-indonesia.js"></script>
    <script src="js/soal-bahasa-arab.js"></script>
    <script src="js/soal-bahasa-inggris.js"></script>

    <script>
        const logEl = document.getElementById('log');
        const btnEl = document.getElementById('btn-seed');

        function log(msg, type = '') {
            const span = document.createElement('span');
            span.className = type;
            span.textContent = msg + '\n';
            logEl.appendChild(span);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function runSeed() {
            btnEl.disabled = true;
            logEl.innerHTML = '';

            if (!isFirebaseConfigured()) {
                log('❌ Firebase belum dikonfigurasi! Cek js/firebase-config.js', 'error');
                btnEl.disabled = false;
                return;
            }

            log('🔄 Memulai upload soal ke Firestore...', 'info');
            log('');

            const subjects = {
                'pai': { name: 'PAI', data: typeof soalPAI !== 'undefined' ? soalPAI : [] },
                'ppkn': { name: 'Pendidikan Pancasila', data: typeof soalPPKN !== 'undefined' ? soalPPKN : [] },
                'matematika': { name: 'Matematika', data: typeof soalMatematika !== 'undefined' ? soalMatematika : [] },
                'bahasa_indonesia': { name: 'Bahasa Indonesia', data: typeof soalBahasaIndonesia !== 'undefined' ? soalBahasaIndonesia : [] },
                'bahasa_arab': { name: 'Bahasa Arab', data: typeof soalBahasaArab !== 'undefined' ? soalBahasaArab : [] },
                'bahasa_inggris': { name: 'Bahasa Inggris', data: typeof soalBahasaInggris !== 'undefined' ? soalBahasaInggris : [] }
            };

            let totalUploaded = 0;

            for (const [key, subject] of Object.entries(subjects)) {
                if (subject.data.length === 0) {
                    log(`⚠️ ${subject.name}: Tidak ada data soal, skip`, 'error');
                    continue;
                }

                try {
                    await db.collection('questionBank').doc(key).set({
                        subject: key,
                        questions: subject.data,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    log(`✅ ${subject.name}: ${subject.data.length} soal berhasil diupload`);
                    totalUploaded += subject.data.length;
                } catch (error) {
                    log(`❌ ${subject.name}: GAGAL - ${error.message}`, 'error');
                }
            }

            log('');
            log(`🎉 Selesai! Total ${totalUploaded} soal berhasil diupload ke Firestore.`);
            log('');
            log('Sekarang file soal JS (soal-*.js) bisa dihapus dari repository.', 'info');
            log('Soal akan diambil langsung dari Firebase Firestore.', 'info');

            btnEl.textContent = '✅ Selesai!';
        }
    </script>
</body>
</html>
