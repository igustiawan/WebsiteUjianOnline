<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ujian Online</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="container">
        <!-- Login Page -->
        <div id="login-page">
            <header>
                <h1>🔐 Admin Panel</h1>
                <p class="subtitle">Ujian Online - SAT TA 2025/2026</p>
            </header>
            <div class="login-box">
                <h2>Login Admin</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Masukkan username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Masukkan password" required>
                    </div>
                    <div id="login-error" class="error-msg" style="display:none;"></div>
                    <button type="submit" class="btn btn-primary btn-full">🔓 Masuk</button>
                </form>
                <div class="login-footer">
                    <a href="index.html">← Kembali ke halaman ujian</a>
                </div>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-page" style="display: none;">
            <div class="admin-header">
                <div>
                    <h1>📊 Dashboard Admin</h1>
                    <p>Pantau hasil ujian dan kelola soal</p>
                </div>
                <div class="admin-actions">
                    <button class="btn btn-secondary btn-sm" onclick="showPage('dashboard')">📊 Dashboard</button>
                    <button class="btn btn-secondary btn-sm" onclick="showPage('questions')">📝 Kelola Soal</button>
                    <button class="btn btn-secondary btn-sm" onclick="showPage('history')">📜 History</button>
                    <button class="btn btn-danger btn-sm" onclick="handleLogout()">🚪 Logout</button>
                </div>
            </div>

            <!-- Dashboard Section -->
            <div id="dashboard-section">
                <h2 class="section-title">📈 Pemantauan Per Mata Pelajaran</h2>
                <div class="stats-grid" id="stats-grid"></div>

                <h2 class="section-title">📊 Ringkasan Keseluruhan</h2>
                <div class="summary-box" id="summary-box"></div>
            </div>

            <!-- Question Management Section -->
            <div id="questions-section" style="display: none;">
                <h2 class="section-title">📝 Kelola Bank Soal</h2>
                <div class="subject-tabs" id="subject-tabs"></div>
                <div class="question-list" id="question-list"></div>
                <button class="btn btn-success" onclick="showAddQuestion()">➕ Tambah Soal Baru</button>

                <!-- Add/Edit Question Modal -->
                <div id="question-modal" class="modal" style="display:none;">
                    <div class="modal-content">
                        <h3 id="modal-title">Tambah Soal Baru</h3>
                        <form onsubmit="saveQuestion(event)">
                            <div class="form-group">
                                <label>Pertanyaan</label>
                                <textarea id="q-text" rows="3" required placeholder="Tulis pertanyaan..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Pilihan A</label>
                                <input type="text" id="q-opt-a" required placeholder="Pilihan A">
                            </div>
                            <div class="form-group">
                                <label>Pilihan B</label>
                                <input type="text" id="q-opt-b" required placeholder="Pilihan B">
                            </div>
                            <div class="form-group">
                                <label>Pilihan C</label>
                                <input type="text" id="q-opt-c" required placeholder="Pilihan C">
                            </div>
                            <div class="form-group">
                                <label>Pilihan D</label>
                                <input type="text" id="q-opt-d" required placeholder="Pilihan D">
                            </div>
                            <div class="form-group">
                                <label>Jawaban Benar</label>
                                <select id="q-answer" required>
                                    <option value="0">A</option>
                                    <option value="1">B</option>
                                    <option value="2">C</option>
                                    <option value="3">D</option>
                                </select>
                            </div>
                            <div class="modal-actions">
                                <button type="submit" class="btn btn-success">💾 Simpan</button>
                                <button type="button" class="btn btn-secondary" onclick="closeModal()">Batal</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- History Section -->
            <div id="history-section" style="display: none;">
                <h2 class="section-title">📜 Riwayat Ujian</h2>
                <div class="filter-bar">
                    <select id="history-filter" onchange="renderHistory()">
                        <option value="all">Semua Mata Pelajaran</option>
                        <option value="pai">PAI</option>
                        <option value="ppkn">Pendidikan Pancasila</option>
                        <option value="matematika">Matematika</option>
                        <option value="bahasa_indonesia">Bahasa Indonesia</option>
                        <option value="bahasa_arab">Bahasa Arab</option>
                        <option value="bahasa_inggris">Bahasa Inggris</option>
                    </select>
                    <button class="btn btn-danger btn-sm" onclick="clearHistory()">🗑️ Hapus Semua History</button>
                </div>
                <div class="history-list" id="history-list"></div>
            </div>
        </div>
    </div>

    <script src="js/soal-pai.js"></script>
    <script src="js/soal-ppkn.js"></script>
    <script src="js/soal-matematika.js"></script>
    <script src="js/soal-bahasa-indonesia.js"></script>
    <script src="js/soal-bahasa-arab.js"></script>
    <script src="js/soal-bahasa-inggris.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
